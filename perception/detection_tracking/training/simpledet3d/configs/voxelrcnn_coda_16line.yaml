# 16 线降采样 CODa 的单帧行人检测，数据根中需包含 3d_comp_downsample/os1。
_BASE_CONFIG_: voxelrcnn_coda.yaml
CLASS_NAMES: ['Pedestrian']
DATA_CONFIG:
    DATA_PATH: 'data/coda_downsample'
    POINT_CLOUD_RANGE: [-4.8, -9.6, -1.5, 14.4, 9.6, 4.5]
    BALANCED_RESAMPLING: false
MODEL:
    DENSE_HEAD:
        CLASS_NAMES_EACH_HEAD: [['Pedestrian']]
OPTIMIZATION:
    BATCH_SIZE_PER_GPU: 8
    NUM_EPOCHS: 20
    LR: 0.003
