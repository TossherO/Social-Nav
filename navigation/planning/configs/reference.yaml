# A single asynchronous spatial-reference worker; local control has no job queue.
# 参考路径请求的最短重试间隔，单位为秒。
retry_s: 1.0
# 连续跟随请求当前目标的最短重算间隔，单位为秒。
follow_retry_s: 0.25
# 同一跟随对象的新旧目标允许共用已有路径的最大距离，单位为米。
follow_goal_delta_m: 0.8
# 参考路径失败后的重试等待时间，单位为秒。
failure_retry_s: 3.0
# 参考路径重新验证的时间间隔，单位为秒。
revalidate_s: 3.0
# 操作的超时时间，单位为秒。
timeout_s: 2.0
# 结果允许的最大年龄，单位为秒。
max_age_s: 5.0
# 启动阶段允许的最长等待时间，单位为秒。
startup_timeout_s: 12.0
# 终点直线接近段的长度，单位为米。
terminal_straight_m: 1.5
# 行人附近的同一格进入保留障碍前所需的独立扫描命中次数。
person_obstacle_confirm_scans: 2
# 上述命中须落在同一时间窗口内，单位为秒。
person_obstacle_confirm_window_s: 0.5
# 行人覆盖范围外扩后的可疑命中筛查距离，单位为米。
person_obstacle_margin_m: 0.20
