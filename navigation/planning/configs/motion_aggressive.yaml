# Aggressive opt-in profile; normal navigation defaults to motion.yaml.
# Retained from outputs/navigation/history/offline/october20_motion_limits/inputs/motion.yaml.
# Reference ceiling for gradual tuning, not measured hardware limits.
# Selection and scope: docs/感知导航运行手册.md, section 选择运动配置.
max_forward_mps: 1.3
max_angular_rps: 1.0
max_acceleration_mps2: 0.8
max_angular_acceleration_rps2: 1.0
# The historical profile supplies unmodified limits and records provenance;
# no historical controller is loaded. Explicit values above override it.
model: differential
parameters_assumed: true
collision_backend: cpu
collision_library: outputs/navigation/build/libsocial_nav_collision_cuda.so
# User-selected wheel_nav:v1 radius for moving search arcs. With spin enabled,
# this is not a hard curvature constraint on differential velocity commands.
min_turning_radius_m: 1.05
performance_reference: configs/wheelchair_motion_reference.json
performance_profile: teb
# Reverse capability confirmed by the user; numeric speed/braking limits remain assumed.
allow_reverse: true
# In-place rotation confirmed by the user; angular limits remain assumed.
allow_in_place_rotation: true
reverse_tolerance_mps: 0.005
max_initial_lateral_mps: 0.08
max_initial_profile_ratio: 2.0
state_window_s: 0.35
state_max_age_s: 0.15
state_max_gap_s: 0.16
stationary_min_window_s: 0.2
stationary_position_span_m: 0.004
stationary_yaw_span_rad: 0.006
stationary_max_linear_mps: 0.03
stationary_max_angular_rps: 0.04
max_result_age_s: 0.5
brake_deceleration_scale: 0.75
