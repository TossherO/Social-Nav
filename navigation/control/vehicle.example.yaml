# Fill from measurements on THIS wheelchair. Nulls intentionally prevent execution.
# 配置或记录的格式标识。
format: wheelchair_vehicle_profile
# 车辆档案标识。
vehicle_id: null
# 车辆参数来源及确认状态。
verification:
  # 该记录或配置的来源。
  source: null
  # 车辆几何是否按档案确认。
  geometry_confirmed: false
  # 运动参数是否按档案确认。
  motion_confirmed: false
  # 底盘协议是否按档案确认。
  protocol_confirmed: false
# 车辆轮廓及雷达到车体的外参。
geometry:
  # 以车体参考坐标系表示的轮廓顶点，单位为米。
  footprint: null  # Ordered convex polygon, base XY in metres, including rider/load.
  # 雷达到车体坐标系的齐次变换矩阵。
  base_from_lidar: null  # Measured 4x4 rigid transform.
# 车辆档案中声明的约束；是否实测须查阅来源记录。
measured_limits:
  # 规划允许的最大前进速度，单位为米每秒。
  max_forward_mps: null
  # 规划允许的最大倒车速度，单位为米每秒。
  max_reverse_mps: null
  # 规划允许的最大角速度，单位为弧度每秒。
  max_angular_rps: null
  # 规划使用的最大线加速度，单位为米每二次方秒。
  max_acceleration_mps2: null
  # 规划使用的最大角加速度，单位为弧度每二次方秒。
  max_angular_acceleration_rps2: null
# 19200 baud; zero/mode3 -> zero/mode1 -> targets; zero/mode3 to disarm.
# Confirm feedback payload-byte checksum and both joystick neutral fields as well.
# 底盘通信协议标识。
protocol: null  # af01_12_bf01_32_payload_sum_mode1_3
# 定位反馈的平面速度上限，单位米每秒。
execution_max_longitudinal_speed_mps: null
# Raw wire field meaning must be verified on this controller. Feedback bounds
# are independent from the enforced host command caps.
# 底盘控制帧与反馈范围设置。
controller: null  # {velocity_limit_field: ..., feedback_max_linear_mps: ..., feedback_max_angular_rps: ...}
