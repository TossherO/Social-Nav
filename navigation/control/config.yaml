# Non-executing simulation/shadow development settings, not chassis tuning.
# 观察数据允许的最大年龄，单位为秒。
observation_max_age_s: 0.5
# 运动反馈允许的最大年龄，单位为秒。
feedback_max_age_s: 0.15
# 目标位置到达容差，单位为米。
goal_position_tolerance_m: 0.12
# 目标朝向到达容差，单位为弧度。
goal_yaw_tolerance_rad: 0.12
# 目标跟踪使用的反应时间预算，单位为秒。
goal_reaction_s: 0.4
# 判定停止时允许的线速度上限，单位为米每秒。
stopped_linear_mps: 0.03
# 判定停止时允许的角速度上限，单位为弧度每秒。
stopped_angular_rps: 0.03
# 到达后保持停止状态所需时间，单位为秒。
goal_dwell_s: 0.5
